<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>オンラインじゃんけんゲーム</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }
        #app {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        /* ロビー画面 */
        #lobby {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            gap: 15px;
        }
        input, button {
            font-size: 16px;
            padding: 12px 20px;
            width: 80%;
            border-radius: 8px;
            border: 1px solid #ccc;
            outline: none;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        button:active {
            background-color: #0056b3;
        }
        /* ゲーム画面 */
        #game-screen {
            display: none;
            flex: 1;
            flex-direction: column;
            padding: 15px;
            position: relative;
        }
        /* ステータスエリア */
        .status-bar {
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .hp-container {
            display: flex;
            gap: 4px;
            margin-top: 5px;
        }
        .heart {
            width: 18px;
            height: 18px;
            background-color: #ff4d4d;
            position: relative;
            transform: rotate(-45deg);
            display: inline-block;
        }
        .heart::before, .heart::after {
            content: "";
            width: 18px;
            height: 18px;
            background-color: #ff4d4d;
            border-radius: 50%;
            position: absolute;
        }
        .heart::before { top: -9px; left: 0; }
        .heart::after { left: 9px; top: 0; }
        .heart.lost {
            background-color: #cccccc;
        }
        .heart.lost::before, .heart.lost::after {
            background-color: #cccccc;
        }

        /* プレイヤーブロックの配置 */
        .battle-area {
            flex: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
        }
        .player-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 45%;
            gap: 20px;
        }
        /* キャラクターの顔 */
        .character-face {
            width: 100px;
            height: 100px;
            border: 3px solid #333;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            background-color: #fff;
        }
        /* 出した手のアート */
        .hand-display {
            width: 80px;
            height: 80px;
            border: 2px dashed #999;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            background-color: #fafafa;
        }

        /* 操作パネル (画面最下部) */
        .controls {
            display: flex;
            justify-content: space-around;
            padding: 20px 10px;
            background-color: #f8f9fa;
            border-top: 1px solid #eee;
            gap: 10px;
        }
        .hand-btn {
            flex: 1;
            padding: 15px 0;
            font-size: 18px;
            background-color: #fff;
            color: #333;
            border: 2px solid #ccc;
            border-radius: 10px;
        }
        .hand-btn.selected {
            background-color: #e1f5fe;
            border-color: #0288d1;
            color: #0288d1;
        }

        /* メッセージ・通知表示 */
        #message-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0,0,0,0.8);
            color: white;
            padding: 15px 30px;
            border-radius: 20px;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            z-index: 10;
            display: none;
            pointer-events: none;
            white-space: nowrap;
        }

        /* チャットエリア */
        #chat-section {
            border-top: 1px solid #ddd;
            height: 150px;
            display: flex;
            flex-direction: column;
            background: #fff;
        }
        #chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
            font-size: 14px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .chat-row {
            margin-bottom: 20px;
        }
        #chat-form {
            display: flex;
            border-top: 1px solid #eee;
        }
        #chat-input {
            flex: 1;
            border: none;
            padding: 10px;
            font-size: 14px;
            border-radius: 0;
        }
        #chat-send {
            width: 70px;
            padding: 10px;
            border-radius: 0;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div id="app">
    <div id="lobby">
        <h2 style="margin-bottom: 10px;">じゃんけんルーム</h2>
        <input type="text" id="room-input" placeholder="4桁のルームIDを入力" maxlength="4" pattern="\d*">
        <button id="join-btn">ルームに入る</button>
    </div>

    <div id="game-screen">
        <div id="message-overlay">相手の待機中...</div>

        <div class="status-bar">
            <div>
                <div>自分</div>
                <div class="hp-container" id="my-hp">
                    <div class="heart"></div>
                    <div class="heart"></div>
                    <div class="heart"></div>
                </div>
            </div>
            <div style="text-align: right;">
                <div>相手</div>
                <div class="hp-container" id="opp-hp">
                    <div class="heart"></div>
                    <div class="heart"></div>
                    <div class="heart"></div>
                </div>
            </div>
        </div>

        <div class="battle-area">
            <div class="player-block">
                <div class="character-face" id="my-face">^-^</div>
                <div class="hand-display" id="my-hand-box">？</div>
            </div>
            <div class="player-block">
                <div class="character-face" id="opp-face">-_-</div>
                <div class="hand-display" id="opp-hand-box">？</div>
            </div>
        </div>

        <div class="controls">
            <button class="hand-btn" data-hand="G">グー</button>
            <button class="hand-btn" data-hand="C">チョキ</button>
            <button class="hand-btn" data-hand="P">パー</button>
        </div>

        <div id="chat-section">
            <div id="chat-messages"></div>
            <div id="chat-form">
                <input type="text" id="chat-input" placeholder="メッセージを入力..." maxlength="30">
                <button id="chat-send">送信</button>
            </div>
        </div>
    </div>
</div>

<script src="game.js"></script>
</body>
</html>
