<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Super RPS</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <style>
        :root {
            --green:  #00ff00;
            --cyan:   #00ffff;
            --yellow: #ffff00;
            --red:    #ff4444;
            --dim:    #888888;
            --border: #444444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #000;
            color: #fff;
            font-family: 'MS Gothic', 'Courier New', monospace;
            min-height: 100vh;
        }

        /* ================================================
           セットアップ画面
        ================================================ */
        #setup-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        #setup-screen h1 {
            font-size: clamp(32px, 8vw, 64px);
            color: var(--green);
            text-shadow: 3px 3px #005500;
            margin-bottom: 40px;
            letter-spacing: 4px;
        }
        #setup-join {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            border: 2px solid var(--border);
            padding: 40px clamp(20px, 8vw, 60px);
            width: 100%;
            max-width: 340px;
        }
        #setup-join p {
            color: var(--dim);
            font-size: 13px;
            line-height: 1.6;
            text-align: center;
        }
        input[type="text"] {
            background: #000;
            color: #fff;
            border: 2px solid var(--cyan);
            padding: 14px;
            font-size: 28px;
            font-family: inherit;
            text-align: center;
            width: 100%;
            letter-spacing: 10px;
        }

        /* ================================================
           ゲーム画面
        ================================================ */
        #game-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            padding: 16px 12px 32px;
            min-height: 100vh;
        }
        #game-screen h1 {
            font-size: clamp(24px, 6vw, 48px);
            color: var(--green);
            text-shadow: 2px 2px #005500;
            margin-bottom: 6px;
            letter-spacing: 4px;
        }
        .room-info {
            font-size: 14px;
            color: var(--cyan);
            margin-bottom: 16px;
            letter-spacing: 2px;
        }

        /* ── プレイヤーエリア（顔 + HP） ── */
        .players-row {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 700px;
            margin-bottom: 14px;
        }
        .player-box {
            flex: 1;
            background: #0a0a0a;
            border: 2px solid var(--border);
            padding: 10px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .player-name {
            font-size: clamp(11px, 3vw, 14px);
            color: var(--yellow);
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        /* 顔スプライト表示エリア */
        .face-wrap {
            position: relative;
            /* 表示サイズ：274×320 を 0.55 倍で 150×176 */
            width:  150px;
            height: 176px;
            border: 3px solid #555;
            background: #111;
            overflow: hidden;
            image-rendering: pixelated;
        }
        /* スマホでやや縮小 */
        @media (max-width: 400px) {
            .face-wrap { width: 120px; height: 140px; }
        }
        .face-wrap canvas {
            position: absolute;
            top: 0; left: 0;
            image-rendering: pixelated;
        }

        .hp-bar {
            margin-top: 8px;
            font-size: clamp(12px, 3.5vw, 16px);
            color: var(--red);
            letter-spacing: 2px;
            min-height: 20px;
            text-align: center;
        }
        .hp-bar.waiting { color: var(--dim); font-size: 12px; }

        /* ── バトルフィールド ── */
        #battle-wrap {
            width: 100%;
            max-width: 700px;
            border: 3px solid #fff;
            background: #000033;
            margin-bottom: 14px;
            /* 顔エリアより小さく */
            min-height: 130px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px 16px;
        }
        #battle-text {
            font-size: clamp(13px, 3.5vw, 17px);
            line-height: 2;
            text-align: center;
            width: 100%;
        }

        /* ── じゃんけんボタン ── */
        .controls {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 700px;
            justify-content: center;
        }
        .controls button {
            flex: 1;
            max-width: 160px;
            padding: 14px 4px;
            font-size: clamp(14px, 4vw, 18px);
        }

        /* ── 共通ボタン ── */
        button {
            background: #000;
            color: #fff;
            border: 2px solid #fff;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.1s, color 0.1s;
        }
        button:hover:not(:disabled) { background: #fff; color: #000; }
        button:disabled { opacity: 0.35; cursor: not-allowed; }
    </style>
</head>
<body>

<!-- セットアップ画面 -->
<div id="setup-screen">
    <h1>Super RPS</h1>
    <div id="setup-join">
        <p>ROOM IDを入力してENTER<br>IDが存在しない場合は新規作成</p>
        <input type="text" id="input-room-id" placeholder="0000" maxlength="4" inputmode="numeric">
        <button id="btn-join" style="width:100%;padding:14px;font-size:18px;">ENTER</button>
    </div>
</div>

<!-- ゲーム画面 -->
<div id="game-screen">
    <h1>Super RPS</h1>
    <div class="room-info">ROOM: <span id="display-room-id">----</span> &nbsp;|&nbsp; YOU: <span id="display-role">-</span></div>

    <div class="players-row">
        <!-- P1 -->
        <div class="player-box">
            <div class="player-name">PLAYER 1</div>
            <div class="face-wrap">
                <canvas id="face-canvas-p1"></canvas>
            </div>
            <div id="p1-hp" class="hp-bar">HP: [   ]</div>
        </div>
        <!-- P2 -->
        <div class="player-box">
            <div class="player-name">PLAYER 2</div>
            <div class="face-wrap">
                <canvas id="face-canvas-p2"></canvas>
            </div>
            <div id="p2-hp" class="hp-bar waiting">WAITING...</div>
        </div>
    </div>

    <!-- バトルフィールド -->
    <div id="battle-wrap">
        <div id="battle-text" style="color:#00ffff;">相手の参加を待っています...</div>
    </div>

    <!-- じゃんけんボタン -->
    <div class="controls">
        <button id="btn-rock">GU</button>
        <button id="btn-paper">PA</button>
        <button id="btn-scissors">CHOKI</button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="game.js"></script>
</body>
</html>
