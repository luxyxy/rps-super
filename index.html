<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ONLINE RPS-98</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        /* ご提示いただいたフォントファイルを埋め込み設定 */
        @font-face {
            font-family: 'PC98Font';
            src: url('font.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            /* すべてのテキストに指定フォントを適用 */
            font-family: 'PC98Font', monospace, sans-serif;
            image-rendering: pixelated;
        }

        body {
            background-color: #000000; /* PC-98の基本、真っ黒画面 */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #00ff00; /* グリーンディスプレイ風 */
            padding: 10px;
        }

        #app {
            width: 100%;
            max-width: 480px;
            height: 100%;
            max-height: 800px;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            position: relative;
            border: 4px double #00ff00; /* 2重線のレトロ枠 */
            padding: 10px;
        }

        /* ロビー画面 */
        #lobby {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }
        
        h2 {
            font-size: 24px;
            color: #00ff00;
            text-shadow: 0 0 5px #00ff00;
            margin-bottom: 10px;
        }

        input {
            font-size: 18px;
            padding: 10px;
            width: 80%;
            background-color: #000000;
            border: 2px solid #00ff00;
            color: #00ff00;
            text-align: center;
            outline: none;
        }

        button {
            font-size: 18px;
            padding: 12px 20px;
            background-color: #000000;
            color: #00ff00;
            border: 2px solid #00ff00;
            font-weight: bold;
            cursor: pointer;
        }
        button:active:not(:disabled) {
            background-color: #00ff00;
            color: #000000;
        }
        button:disabled {
            border-color: #555555;
            color: #555555;
            cursor: not-allowed;
        }

        /* ゲーム画面 */
        #game-screen {
            display: none;
            flex: 1;
            flex-direction: column;
            position: relative;
            gap: 15px;
        }

        /* ステータスエリア */
        .status-bar {
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            border-bottom: 2px dashed #00ff00;
            padding-bottom: 10px;
        }

        /* タイル状のライフ表現 */
        .hp-container {
            display: flex;
            gap: 5px;
            margin-top: 5px;
        }
        .heart {
            width: 16px;
            height: 16px;
            background-color: #ff0000; /* パキッとした赤 */
            border: 1px solid #ffffff;
        }
        .heart.lost {
            background-color: #555555; /* 暗いグレー */
            border: 1px solid #333333;
        }

        /* プレイヤーブロックの配置 */
        .battle-area {
            flex: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .player-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 48%;
            gap: 15px;
        }

        /* キャラクターの顔（ドット枠風） */
        .character-face {
            width: 90px;
            height: 90px;
            border: 2px solid #00ffff; /* シアン */
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            background-color: #000000;
            color: #00ffff;
        }

        /* 出した手のアート（正方形ウィンドウ風） */
        .hand-display {
            width: 100%;
            height: 60px;
            border: 2px solid #ffff00; /* イエロー */
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            background-color: #000000;
            color: #ffff00;
        }

        /* 操作パネル (画面下部) */
        .controls {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }
        .hand-btn {
            flex: 1;
            padding: 15px 0;
            font-size: 16px;
            background-color: #000000;
            color: #ffffff;
            border: 2px solid #ffffff;
        }
        .hand-btn.selected {
            background-color: #ffffff;
            color: #000000;
            border-color: #ffffff;
        }

        /* メッセージ・通知表示 */
        #message-overlay {
            position: absolute;
            top: 35%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #000000;
            color: #ffffff;
            border: 3px double #ffffff;
            padding: 15px 20px;
            font-size: 18px;
            text-align: center;
            z-index: 10;
            display: none;
            pointer-events: none;
            white-space: nowrap;
            box-shadow: 0 0 15px rgba(255,255,255,0.5);
        }

        /* チャットエリア */
        #chat-section {
            border: 2px solid #00ff00;
            height: 120px;
            display: flex;
            flex-direction: column;
            background: #000000;
        }
        #chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 5px;
            font-size: 14px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            color: #00ff00;
        }
        .chat-row {
            word-break: break-all;
        }
        #chat-form {
            display: flex;
            border-top: 2px solid #00ff00;
        }
        #chat-input {
            flex: 1;
            border: none;
            padding: 8px;
            font-size: 14px;
            background-color: #000000;
            color: #00ff00;
            text-align: left;
        }
        #chat-send {
            width: 70px;
            padding: 8px;
            font-size: 14px;
            border: none;
            border-left: 2px solid #00ff00;
            background-color: #000000;
            color: #00ff00;
        }
    </style>
</head>
<body>

<div id="app">
    <div id="lobby">
        <h2>RPS-SYSTEM Ver1.0</h2>
        <input type="text" id="room-input" placeholder="ROOM ID (4-DIGIT)" maxlength="4" pattern="\d*">
        <button id="join-btn">CONNECT</button>
    </div>

    <div id="game-screen">
        <div id="message-overlay">WAITING FOR ENEMY...</div>

        <div class="status-bar">
            <div>
                <div>1P (YOU)</div>
                <div class="hp-container" id="my-hp">
                    <div class="heart"></div>
                    <div class="heart"></div>
                    <div class="heart"></div>
                </div>
            </div>
            <div style="text-align: right;">
                <div>2P (ENEMY)</div>
                <div class="hp-container" id="opp-hp">
                    <div class="heart"></div>
                    <div class="heart"></div>
                    <div class="heart"></div>
                </div>
            </div>
        </div>

        <div class="battle-area">
            <div class="player-block">
                <div class="character-face" id="my-face">^-^</div>
                <div class="hand-display" id="my-hand-box">READY</div>
            </div>
            <div class="player-block">
                <div class="character-face" id="opp-face">-_-</div>
                <div class="hand-display" id="opp-hand-box">READY</div>
            </div>
        </div>

        <div class="controls">
            <button class="hand-btn" data-hand="G">グー</button>
            <button class="hand-btn" data-hand="C">チョキ</button>
            <button class="hand-btn" data-hand="P">パー</button>
        </div>

        <div id="chat-section">
            <div id="chat-messages"></div>
            <div id="chat-form">
                <input type="text" id="chat-input" placeholder="MESSAGE..." maxlength="30" autocomplete="off">
                <button id="chat-send">SEND</button>
            </div>
        </div>
    </div>
</div>

<script src="game.js"></script>
</body>
</html>
