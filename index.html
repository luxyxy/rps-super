<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スーパーRPS</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #000;
            color: #fff;
            font-family: 'MS Gothic', 'Courier New', monospace;
            text-align: center;
        }
        h1 {
            font-size: 48px;
            color: #00ff00;
            text-shadow: 3px 3px #005500;
            padding: 40px 0 30px;
        }

        /* ── セットアップ画面 ── */
        #setup-screen { padding: 0 20px 60px; }
        #setup-join {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            border: 2px solid #444;
            padding: 40px 60px;
        }
        #setup-join p { color: #888; font-size: 14px; }

        input[type="text"] {
            background: #000;
            color: #fff;
            border: 2px solid #00ffff;
            padding: 12px;
            font-size: 24px;
            font-family: inherit;
            text-align: center;
            width: 200px;
            letter-spacing: 8px;
        }

        /* ── ゲーム画面 ── */
        #game-screen { display: none; padding: 0 20px 40px; }
        .room-info { font-size: 18px; color: #00ffff; margin-bottom: 20px; }

        .game-container { max-width: 800px; margin: 0 auto; }

        /* プレイヤーステータス */
        .players-row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .player-box {
            flex: 1;
            background: #111;
            border: 2px solid #444;
            padding: 15px;
        }
        .player-name { font-size: 16px; color: #ffff00; margin-bottom: 10px; }
        .face-sprite {
            width: 120px; height: 120px;
            border: 4px solid #fff;
            background: #000;
            background-repeat: no-repeat;
            margin: 10px auto;
            image-rendering: pixelated;
        }
        .hp-display { font-size: 20px; color: #ff4444; margin-top: 8px; min-height: 28px; }

        /* Canvas */
        #canvas-wrap {
            width: 600px; height: 300px;
            border: 4px solid #fff;
            background: #000055;
            margin: 0 auto 20px;
        }
        canvas { display: block; width: 100%; height: 100%; }

        /* ボタン共通 */
        button {
            background: #000;
            color: #fff;
            border: 2px solid #fff;
            padding: 14px 28px;
            font-size: 18px;
            font-family: inherit;
            cursor: pointer;
        }
        button:hover:not(:disabled) { background: #fff; color: #000; }
        button:disabled { opacity: 0.35; cursor: not-allowed; }

        /* じゃんけんボタン */
        .controls { display: flex; justify-content: center; gap: 16px; }
    </style>
</head>
<body>

<!-- ── セットアップ画面 ── -->
<div id="setup-screen">
    <h1>スーパーRPS</h1>
    <div id="setup-join">
        <p>ROOM IDを入力して参加<br>（存在しないIDを入力すると新規作成）</p>
        <input type="text" id="input-room-id" placeholder="0000" maxlength="4" inputmode="numeric">
        <button id="btn-join">ENTER</button>
    </div>
</div>

<!-- ── ゲーム画面 ── -->
<div id="game-screen">
    <h1>スーパーRPS</h1>
    <div class="room-info">ROOM ID: <span id="display-room-id">----</span></div>

    <div class="game-container">
        <div class="players-row">
            <div class="player-box">
                <div class="player-name">PLAYER 1</div>
                <div id="p1-face" class="face-sprite"></div>
                <div id="p1-hp"   class="hp-display">HP: ❤️❤️❤️</div>
            </div>
            <div class="player-box">
                <div class="player-name">PLAYER 2</div>
                <div id="p2-face" class="face-sprite"></div>
                <div id="p2-hp"   class="hp-display">WAITING...</div>
            </div>
        </div>

        <div id="canvas-wrap">
            <canvas id="gameCanvas" width="600" height="300"></canvas>
        </div>

        <div class="controls">
            <button id="btn-rock">グー ✊</button>
            <button id="btn-paper">パー ✋</button>
            <button id="btn-scissors">チョキ ✌</button>
        </div>
    </div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="game.js"></script>
</body>
</html>
