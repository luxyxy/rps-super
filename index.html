<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スーパーRPS</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #ffffff;
            font-family: 'MS Gothic', 'Courier New', monospace;
            display: block;
            text-align: center;
        }
        #setup-screen {
            padding: 60px 20px;
        }
        #game-screen {
            display: none;
            padding: 20px;
        }
        h1 {
            font-size: 48px;
            color: #00ff00;
            text-shadow: 3px 3px #005500;
            margin-bottom: 40px;
        }
        .room-info {
            font-size: 20px;
            margin-bottom: 20px;
            color: #00ffff;
        }
        .game-container {
            display: block;
            margin: 0 auto;
            max-width: 800px;
        }
        .players-status-wrapper {
            display: table;
            width: 100%;
            margin-bottom: 20px;
            border-spacing: 20px 0;
        }
        .player-status-cell {
            display: table-cell;
            width: 50%;
            vertical-align: top;
            text-align: center;
            background-color: #111111;
            border: 2px solid #444444;
            padding: 15px;
        }
        .player-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #ffff00;
        }
        .face-sprite {
            width: 120px;
            height: 120px;
            border: 4px solid #ffffff;
            background-color: #000000;
            background-repeat: no-repeat;
            margin: 10px auto;
            image-rendering: pixelated;
        }
        .hp-display {
            font-size: 24px;
            font-weight: bold;
            color: #ff0000;
            letter-spacing: 4px;
            margin-top: 10px;
        }
        #canvas-container {
            position: relative;
            margin: 20px auto;
            width: 600px;
            height: 300px;
            border: 4px solid #ffffff;
            background-color: #000055;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .controls {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        button {
            background-color: #000000;
            color: #ffffff;
            border: 2px solid #ffffff;
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            font-family: inherit;
        }
        button:hover {
            background-color: #ffffff;
            color: #000000;
        }
        input {
            background-color: #000000;
            color: #ffffff;
            border: 2px solid #00ffff;
            padding: 12px;
            font-size: 20px;
            font-family: inherit;
            text-align: center;
            width: 200px;
        }
        #setup-join {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
    </style>
</head>
<body>

    <div id="setup-screen">
        <h1>スーパーRPS</h1>
        <div id="setup-join">
            <input type="text" id="input-room-id" placeholder="ROOM ID" maxlength="4">
            <button id="btn-join">対戦室に参戦</button>
        </div>
    </div>

    <div id="game-screen">
        <h1>スーパーRPS</h1>
        <div class="room-info">ROOM ID: <span id="display-room-id">----</span></div>
        
        <div class="game-container">
            <div class="players-status-wrapper">
                <div class="player-status-cell">
                    <div id="p1-name" class="player-name">PLAYER 1</div>
                    <div id="p1-face" class="face-sprite"></div>
                    <div id="p1-hp" class="hp-display">HP: 3</div>
                </div>
                <div class="player-status-cell">
                    <div id="p2-name" class="player-name">PLAYER 2</div>
                    <div id="p2-face" class="face-sprite"></div>
                    <div id="p2-hp" class="hp-display">HP: 3</div>
                </div>
            </div>

            <div id="canvas-container">
                <canvas id="gameCanvas" width="600" height="300"></canvas>
            </div>

            <div class="controls">
                <button id="btn-rock">グー</button>
                <button id="btn-paper">パー</button>
                <button id="btn-scissors">チョキ</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="game.js"></script>
</body>
</html>
